version: '3.8'

services:
  db:
    image: postgres:16
    container_name: sistema-db
    environment:
      POSTGRES_DB: RESTAURANTE
      POSTGRES_USER: johan
      POSTGRES_PASSWORD: johan2026
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U johan -d RESTAURANTE"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata: