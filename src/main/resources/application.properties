spring.application.name=Sistema
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:RESTAURANTE}
spring.datasource.username=${DB_USER:johan}
spring.datasource.password=${DB_PASSWORD:johan2026}
spring.datasource.driver-class-name=org.postgresql.Driver
server.address=0.0.0.0

spring.jpa.properties.hibernate.default_schema=restaurante
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false
