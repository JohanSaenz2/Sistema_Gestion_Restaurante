<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo Adicional</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #1a1a2e;
            min-height: 100vh;
            color: #ecf0f1;
        }
        .navbar {
            background: #16213e;
            padding: 14px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #e67e22;
        }
        .navbar h1 { color: #e67e22; font-size: 18px; }
        .btn-back { color: #7f8c8d; text-decoration: none; font-size: 13px; }
        .btn-back:hover { color: #e67e22; }
        .container {
            max-width: 560px;
            margin: 40px auto;
            padding: 0 24px;
        }
        .card {
            background: #16213e;
            border-radius: 14px;
            padding: 32px;
            border-top: 3px solid #e67e22;
        }
        .card h2 { font-size: 18px; color: #e67e22; margin-bottom: 24px; }
        .form-group { margin-bottom: 18px; }
        label {
            display: block;
            font-size: 13px;
            color: #bdc3c7;
            margin-bottom: 6px;
            font-weight: 500;
        }
        input {
            width: 100%;
            padding: 11px 14px;
            background: #0f3460;
            border: 1px solid #1a4a7a;
            border-radius: 8px;
            color: #ecf0f1;
            font-size: 14px;
        }
        input:focus {
            outline: none;
            border-color: #e67e22;
        }
        .hint {
            font-size: 11px;
            color: #7f8c8d;
            margin-top: 4px;
        }
        .precio-preview {
            font-size: 28px;
            font-weight: 700;
            color: #e2b04a;
            text-align: center;
            padding: 16px;
            background: #0f3460;
            border-radius: 10px;
            margin-bottom: 18px;
        }
        .btn-guardar {
            width: 100%;
            padding: 13px;
            background: #e67e22;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 8px;
            transition: background 0.2s;
        }
        .btn-guardar:hover    { background: #d35400; }
        .btn-guardar:disabled { background: #5d3310; cursor: not-allowed; }
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            padding: 14px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            display: none;
            color: white;
            z-index: 999;
        }
    </style>
</head>
<body>

<nav class="navbar">
    <div style="display:flex; align-items:center; gap:16px;">
        <a href="/admin" class="btn-back">← Volver</a>
        <h1>Nuevo Adicional</h1>
    </div>
    <span style="color:#bdc3c7; font-size:14px;"
          th:text="${empleado.nombre}">Admin</span>
</nav>

<div class="container">
    <div class="card">
        <h2>➕ Agregar adicional</h2>

        <div class="form-group">
            <label>Nombre del adicional *</label>
            <input type="text" id="nombre"
                   placeholder="Ej: Queso extra, Tocino, Sin cebolla"/>
        </div>

        <div class="form-group">
            <label>Precio extra ($)</label>
            <input type="number" id="precio"
                   placeholder="0.00" min="0" step="0.25"
                   oninput="actualizarPreview()"/>
            <span class="hint">
                Escribe 0 si el adicional no tiene costo extra
            </span>
        </div>

        <div class="precio-preview" id="preview">+ $0.00</div>

        <div class="form-group">
            <label>Aplica a</label>
            <input type="text" id="aplicaA"
                   placeholder="Ej: Platos fuertes, todos"/>
            <span class="hint">
                Categoría o producto al que aplica este adicional
            </span>
        </div>

        <button class="btn-guardar" id="btnGuardar"
                onclick="guardar()">
            Guardar adicional
        </button>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
    function actualizarPreview() {
        const precio = parseFloat(document.getElementById('precio').value) || 0;
        document.getElementById('preview').textContent =
            '+ $' + precio.toFixed(2);
    }

    async function guardar() {
        const nombre  = document.getElementById('nombre').value.trim();
        const precio  = parseFloat(document.getElementById('precio').value) || 0;
        const aplicaA = document.getElementById('aplicaA').value.trim();

        if (!nombre) {
            mostrarToast('❌ El nombre es obligatorio', '#e74c3c');
            return;
        }

        const btn = document.getElementById('btnGuardar');
        btn.disabled    = true;
        btn.textContent = 'Guardando...';

        try {
            const res = await fetch('/api/adicionales', {
                method:  'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ nombre, precio, aplicaA })
            });

            if (res.ok) {
                mostrarToast('✅ Adicional guardado', '#27ae60');
                setTimeout(() => window.location.href = '/admin', 1500);
            } else {
                throw new Error();
            }
        } catch {
            btn.disabled    = false;
            btn.textContent = 'Guardar adicional';
            mostrarToast('❌ Error al guardar', '#e74c3c');
        }
    }

    function mostrarToast(msg, color) {
        const t = document.getElementById('toast');
        t.textContent      = msg;
        t.style.background = color;
        t.style.display    = 'block';
        setTimeout(() => t.style.display = 'none', 2500);
    }
</script>
</body>
</html>
