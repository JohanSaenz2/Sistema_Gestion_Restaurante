<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo Empleado</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #1a1a2e;
            min-height: 100vh;
            color: #ecf0f1;
        }
        .navbar {
            background: #16213e;
            padding: 14px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #9b59b6;
        }
        .navbar h1 { color: #9b59b6; font-size: 18px; }
        .btn-back { color: #7f8c8d; text-decoration: none; font-size: 13px; }
        .btn-back:hover { color: #9b59b6; }
        .container {
            max-width: 560px;
            margin: 40px auto;
            padding: 0 24px;
        }
        .card {
            background: #16213e;
            border-radius: 14px;
            padding: 32px;
            border-top: 3px solid #9b59b6;
        }
        .card h2 { font-size: 18px; color: #9b59b6; margin-bottom: 24px; }
        .form-group { margin-bottom: 18px; }
        label {
            display: block;
            font-size: 13px;
            color: #bdc3c7;
            margin-bottom: 6px;
            font-weight: 500;
        }
        input, select {
            width: 100%;
            padding: 11px 14px;
            background: #0f3460;
            border: 1px solid #1a4a7a;
            border-radius: 8px;
            color: #ecf0f1;
            font-size: 14px;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #9b59b6;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }
        .btn-guardar {
            width: 100%;
            padding: 13px;
            background: #9b59b6;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 8px;
            transition: background 0.2s;
        }
        .btn-guardar:hover    { background: #8e44ad; }
        .btn-guardar:disabled { background: #3d1a5e; cursor: not-allowed; }
        .hint {
            font-size: 11px;
            color: #7f8c8d;
            margin-top: 4px;
        }
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            padding: 14px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            display: none;
            color: white;
            z-index: 999;
        }
    </style>
</head>
<body>

<nav class="navbar">
    <div style="display:flex; align-items:center; gap:16px;">
        <a href="/admin" class="btn-back">← Volver</a>
        <h1>Nuevo Empleado</h1>
    </div>
    <span style="color:#bdc3c7; font-size:14px;"
          th:text="${empleado.nombre}">Admin</span>
</nav>

<div class="container">
    <div class="card">
        <h2>👤 Agregar empleado</h2>

        <div class="form-group">
            <label>Nombre completo *</label>
            <input type="text" id="nombre"
                   placeholder="Ej: Carlos Vega"/>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Usuario *</label>
                <input type="text" id="usuario"
                       placeholder="Ej: cvega"/>
                <span class="hint">Para iniciar sesión</span>
            </div>
            <div class="form-group">
                <label>Contraseña *</label>
                <input type="password" id="password"
                       placeholder="Contraseña"/>
            </div>
        </div>

        <div class="form-group">
            <label>Rol *</label>
            <select id="rol">
                <option value="mesero">🧑‍💼 Mesero</option>
                <option value="cocinero">👨‍🍳 Cocinero</option>
                <option value="bartender">🍹 Bartender</option>
                <option value="administrador">⚙️ Administrador</option>
            </select>
        </div>

        <button class="btn-guardar" id="btnGuardar"
                onclick="guardar()">
            Guardar empleado
        </button>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
    async function guardar() {
        const nombre   = document.getElementById('nombre').value.trim();
        const usuario  = document.getElementById('usuario').value.trim();
        const password = document.getElementById('password').value;
        const rol      = document.getElementById('rol').value;

        if (!nombre || !usuario || !password) {
            mostrarToast('❌ Completa todos los campos', '#e74c3c');
            return;
        }

        const btn = document.getElementById('btnGuardar');
        btn.disabled    = true;
        btn.textContent = 'Guardando...';

        try {
            const res = await fetch('/api/empleados', {
                method:  'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ nombre, usuario, password, rol })
            });

            if (res.ok) {
                mostrarToast('✅ Empleado guardado', '#27ae60');
                setTimeout(() => window.location.href = '/admin', 1500);
            } else {
                throw new Error();
            }
        } catch {
            btn.disabled    = false;
            btn.textContent = 'Guardar empleado';
            mostrarToast('❌ Error al guardar', '#e74c3c');
        }
    }

    function mostrarToast(msg, color) {
        const t = document.getElementById('toast');
        t.textContent      = msg;
        t.style.background = color;
        t.style.display    = 'block';
        setTimeout(() => t.style.display = 'none', 2500);
    }
</script>
</body>
</html>
