<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pantalla Bar</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f3f5f8;
            min-height: 100vh;
            color: #1f2937;
        }

        .navbar {
            background: #ffffff;
            padding: 14px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #7a2410;
            box-shadow: 0 1px 3px rgba(16, 24, 40, 0.10);
        }

        .navbar h1 { color: #661B0A; font-size: 20px; }

        .reloj {
            color: #661B0A;
            font-size: 18px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }

        .layout {
            padding: 24px;
            height: calc(100vh - 54px);
            overflow-y: auto;
        }

        .layout h2 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 16px;
            padding: 10px 14px;
            border-radius: 8px;
            background: rgba(102, 27, 10, 0.15);
            color: #661B0A;
            border: 1px solid #661B0A;
            display: inline-block;
        }

        .comandas-lista {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 16px;
        }

        .comanda-card {
            background: #ffffff;
            border-radius: 12px;
            padding: 16px;
            border-left: 5px solid #999999;
            transition: border-color 0.4s ease;
            box-shadow: 0 1px 3px rgba(16, 24, 40, 0.10);
        }

        /* Semáforo de tiempo de espera */
        .comanda-card.tiempo-verde    { border-left-color: #27ae60; }
        .comanda-card.tiempo-amarillo { border-left-color: #661B0A; }
        .comanda-card.tiempo-rojo     { border-left-color: #e74c3c; }

        .comanda-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .comanda-mesa {
            font-size: 18px;
            font-weight: 700;
            color: #661B0A;
        }

        .comanda-tiempo {
            font-size: 12px;
            color: #6b7280;
            text-align: right;
        }

        .comanda-tiempo .transcurrido {
            display: block;
            font-weight: 700;
            font-size: 13px;
        }

        .comanda-tiempo.tiempo-verde    .transcurrido { color: #27ae60; }
        .comanda-tiempo.tiempo-amarillo .transcurrido { color: #661B0A; }
        .comanda-tiempo.tiempo-rojo     .transcurrido { color: #e74c3c; }

        .badge-estado {
            display: inline-block;
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 10px;
            margin-top: 4px;
            background: rgba(31, 41, 55, 0.08);
            color: #4b5563;
        }

        .item-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 8px 0;
            border-bottom: 1px solid #dfe4ea;
            font-size: 14px;
        }

        .item-row:last-child { border-bottom: none; }

        .item-nombre { font-weight: 600; }

        .item-cant {
            background: #eef1f5;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 13px;
            color: #661B0A;
            font-weight: 700;
        }

        .item-notas {
            font-size: 12px;
            color: #6b7280;
            margin-top: 4px;
        }

        .badge-bebida {
            display: inline-block;
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 10px;
            background: rgba(102, 27, 10, 0.2);
            color: #661B0A;
            margin-left: 6px;
        }

        .vacio {
            text-align: center;
            color: #6b7280;
            padding: 40px;
            font-size: 14px;
        }

        /* Ajustes de paleta clara para estilos en línea (sin modificar el HTML) */
        .navbar span[style*="#cccccc"] { color: #4b5563 !important; }
    </style>
</head>
<body>

<nav class="navbar">
    <h1>🍹 Pantalla de Bar</h1>
    <div style="display:flex; align-items:center; gap:20px;">
        <span class="reloj" id="reloj">00:00:00</span>
        <span style="color:#cccccc; font-size:14px;"
              th:text="${empleado.nombre}">Bartender</span>
        <a href="/logout" style="color:#e74c3c; text-decoration:none;
           font-size:13px; border:1px solid #e74c3c; padding:5px 12px;
           border-radius:6px;">Salir</a>
    </div>
</nav>

<div class="layout">

    <h2>📋 Comandas activas
        (<span th:text="${#lists.size(comandas)}">0</span>)
    </h2>

    <div class="comandas-lista">
        <div th:if="${#lists.isEmpty(comandas)}" class="vacio">
            No hay pedidos activos
        </div>
        <div th:each="c : ${comandas}"
             class="comanda-card"
             th:attr="data-fecha=${c.fecha}">
            <div class="comanda-header">
                <span class="comanda-mesa"
                      th:text="'Mesa ' + ${c.mesa.numero}">Mesa 1</span>
                <span class="comanda-tiempo">
                    <span th:text="${#temporals.format(c.fecha, 'HH:mm')}">12:30</span>
                    <span class="transcurrido">--</span>
                </span>
            </div>
            <span class="badge-estado"
                  th:text="${c.estado.name() == 'pendiente' ? 'Pendiente' : 'En preparación'}">
                Pendiente
            </span>
            <!-- Solo muestra ítems del bar -->
            <div th:each="d : ${c.detalles}"
                 th:if="${d.producto.estacion.name() == 'bar'}"
                 class="item-row" style="margin-top:8px;">
                <div>
                    <div class="item-nombre">
                        <span th:text="${d.producto.nombre}">Mojito</span>
                        <span class="badge-bebida">bar</span>
                    </div>
                    <div class="item-notas"
                         th:if="${d.notas != null and !d.notas.isEmpty()}"
                         th:text="${d.notas}">Sin azúcar</div>
                </div>
                <span class="item-cant"
                      th:text="'x' + ${d.cantidad}">x1</span>
            </div>
        </div>
    </div>
</div>

<script>
    function actualizarReloj() {
        document.getElementById('reloj').textContent =
            new Date().toLocaleTimeString('es-EC');
    }
    setInterval(actualizarReloj, 1000);
    actualizarReloj();

    // Umbrales del semáforo de tiempo de espera (en minutos)
    const UMBRAL_AMARILLO_MIN = 10;
    const UMBRAL_ROJO_MIN = 15;

    function colorPorTiempo(minutos) {
        if (minutos >= UMBRAL_ROJO_MIN) return 'tiempo-rojo';
        if (minutos >= UMBRAL_AMARILLO_MIN) return 'tiempo-amarillo';
        return 'tiempo-verde';
    }

    function actualizarSemaforos() {
        document.querySelectorAll('.comanda-card[data-fecha]').forEach(card => {
            const fecha = new Date(card.dataset.fecha);
            if (isNaN(fecha.getTime())) return;

            const minutos = Math.floor((Date.now() - fecha.getTime()) / 60000);
            const clase = colorPorTiempo(minutos);

            card.classList.remove('tiempo-verde', 'tiempo-amarillo', 'tiempo-rojo');
            card.classList.add(clase);

            const tiempoEl = card.querySelector('.comanda-tiempo');
            tiempoEl.classList.remove('tiempo-verde', 'tiempo-amarillo', 'tiempo-rojo');
            tiempoEl.classList.add(clase);

            const transcurridoEl = card.querySelector('.transcurrido');
            transcurridoEl.textContent = minutos <= 0 ? 'recién llegada' : ('hace ' + minutos + ' min');
        });
    }
    actualizarSemaforos();
    setInterval(actualizarSemaforos, 15000);

    setInterval(() => location.reload(), 30000);
</script>
<div th:replace="~{fragments/notificaciones-mesero :: notificacionesPedidoNuevo('bar')}"></div>
</body>
</html>
