
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="notificacionesPedidoNuevo(topico)">
 
    <div id="notifPedidoContainer" style="
        position: fixed;
        top: 16px;
        right: 16px;
        z-index: 2000;
        display: flex;
        flex-direction: column;
        gap: 10px;
        max-width: 320px;
        pointer-events: none;
    "></div>
 
    <style>
        .notif-pedido-toast {
            pointer-events: auto;
            font-family: 'Segoe UI', sans-serif;
            color: #1a1a2e;
            padding: 14px 16px;
            border-radius: 10px;
            font-size: 13px;
            background: linear-gradient(135deg, #3498db, #2980b9);
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.4);
            cursor: pointer;
            animation: notifPedidoSlideIn 0.35s ease-out;
        }
 
        .notif-pedido-toast .notif-pedido-tag {
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.5px;
            opacity: 0.85;
            margin-bottom: 4px;
        }
 
        .notif-pedido-toast .notif-pedido-msg {
            font-weight: 700;
            font-size: 14px;
        }
 
        .notif-pedido-toast.notif-pedido-out {
            animation: notifPedidoSlideOut 0.3s ease-in forwards;
        }
 
        @keyframes notifPedidoSlideIn {
            from { transform: translateX(130%); opacity: 0; }
            to   { transform: translateX(0);    opacity: 1; }
        }
 
        @keyframes notifPedidoSlideOut {
            from { transform: translateX(0);    opacity: 1; }
            to   { transform: translateX(130%); opacity: 0; }
        }
    </style>
 
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <script th:inline="javascript">
        (function () {
            const topico = /*[[${topico}]]*/ 'cocina';
            const comandasYaAvisadas = new Set(); // evita un toast por cada ítem de la misma comanda
 
            function conectar() {
                const socket = new SockJS('/ws');
                const stomp = Stomp.over(socket);
                stomp.debug = null;
 
                stomp.connect({}, function () {
                    stomp.subscribe('/topic/' + topico, function (mensaje) {
                        const aviso = JSON.parse(mensaje.body);
                        if (aviso.estado === 'pendiente') {
                            mostrarNotificacionNueva(aviso);
                        }
                    });
                }, function () {
                    setTimeout(conectar, 3000);
                });
            }
 
            function mostrarNotificacionNueva(aviso) {
                if (comandasYaAvisadas.has(aviso.comandaId)) return;
                comandasYaAvisadas.add(aviso.comandaId);
                setTimeout(() => comandasYaAvisadas.delete(aviso.comandaId), 5000);
 
                const cont = document.getElementById('notifPedidoContainer');
                const toast = document.createElement('div');
                toast.className = 'notif-pedido-toast';
                toast.innerHTML = `
                    <div class="notif-pedido-tag">🆕 COMANDA NUEVA</div>
                    <div class="notif-pedido-msg">Pedido #${aviso.comandaId} recibido</div>
                `;
                toast.onclick = () => cerrar(toast);
                cont.prepend(toast);
 
                reproducirTono();
                setTimeout(() => cerrar(toast), 6000);
            }
 
            function cerrar(toast) {
                if (!toast.isConnected) return;
                toast.classList.add('notif-pedido-out');
                setTimeout(() => toast.remove(), 300);
            }
 
            function reproducirTono() {
                try {
                    const ctx = new (window.AudioContext || window.webkitAudioContext)();
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.type = 'sine';
                    osc.frequency.value = 660;
                    gain.gain.setValueAtTime(0.16, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.4);
                } catch (e) { /* algunos navegadores bloquean audio sin interacción previa */ }
            }
 
            conectar();
        })();
    </script>
 
</div>
</body>
</html>
