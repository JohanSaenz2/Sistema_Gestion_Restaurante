<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesas</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #1a1a2e;
            min-height: 100vh;
            color: #ecf0f1;
        }

        .navbar {
            background: #16213e;
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #e2b04a;
        }

        .navbar h1 { color: #e2b04a; font-size: 20px; }

        .navbar .info {
            display: flex;
            align-items: center;
            gap: 16px;
            color: #bdc3c7;
            font-size: 14px;
        }

        .logout {
            background: transparent;
            border: 1px solid #e74c3c;
            color: #e74c3c;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            text-decoration: none;
        }

        .logout:hover { background: #e74c3c; color: white; }

        .container {
            padding: 32px 24px;
            max-width: 1100px;
            margin: 0 auto;
        }

        .titulo {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .subtitulo {
            color: #7f8c8d;
            font-size: 14px;
            margin-bottom: 32px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 20px;
        }

        .mesa {
            background: #16213e;
            border-radius: 12px;
            padding: 28px 16px;
            text-align: center;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.2s;
            text-decoration: none;
            color: inherit;
            display: block;
        }

        .mesa:hover { transform: translateY(-4px); }

        .mesa.libre {
            border-color: #27ae60;
        }

        .mesa.libre:hover {
            background: rgba(39, 174, 96, 0.15);
            border-color: #2ecc71;
        }

        .mesa.ocupada {
            border-color: #e74c3c;
            opacity: 0.7;
            cursor: not-allowed;
            pointer-events: none;
        }

        .mesa.reservada {
            border-color: #f39c12;
            opacity: 0.8;
            cursor: not-allowed;
            pointer-events: none;
        }

        .mesa-numero {
            font-size: 36px;
            font-weight: 700;
            color: #e2b04a;
            margin-bottom: 8px;
        }

        .mesa-label {
            font-size: 13px;
            color: #7f8c8d;
            margin-bottom: 12px;
        }

        .mesa-estado {
            font-size: 12px;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 20px;
            display: inline-block;
        }

        .estado-libre {
            background: rgba(39, 174, 96, 0.2);
            color: #2ecc71;
        }

        .estado-ocupada {
            background: rgba(231, 76, 60, 0.2);
            color: #e74c3c;
        }

        .estado-reservada {
            background: rgba(243, 156, 18, 0.2);
            color: #f39c12;
        }

        .leyenda {
            display: flex;
            gap: 24px;
            margin-top: 32px;
            font-size: 13px;
            color: #7f8c8d;
        }

        .leyenda-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        .dot-libre    { background: #27ae60; }
        .dot-ocupada  { background: #e74c3c; }
        .dot-reservada{ background: #f39c12; }
    </style>
</head>
<body>

<nav class="navbar">
    <h1>🍽 Sistema de Comandas</h1>
    <div class="info">
        <span th:text="'Hola, ' + ${empleado.nombre}"></span>
        <a href="/logout" class="logout">Cerrar sesión</a>
    </div>
</nav>

<div class="container">
    <p class="titulo">Selecciona una mesa</p>
    <p class="subtitulo">Solo las mesas en estado <strong>libre</strong> están disponibles</p>

    <div class="grid">
        <!-- Itera sobre todas las mesas -->
        <a th:each="mesa : ${mesas}"
           th:href="@{/pedido/{id}(id=${mesa.mesaId})}"
           th:class="'mesa ' + ${mesa.estado.name().toLowerCase()}"
           class="mesa">

            <div class="mesa-numero" th:text="${mesa.numero}">1</div>
            <div class="mesa-label">Mesa</div>
            <span th:class="'mesa-estado estado-' + ${mesa.estado.name().toLowerCase()}"
                  th:text="${mesa.estado.name().toLowerCase()}">
                libre
            </span>
        </a>
    </div>

    <div class="leyenda">
        <div class="leyenda-item">
            <div class="dot dot-libre"></div> Libre — disponible
        </div>
        <div class="leyenda-item">
            <div class="dot dot-ocupada"></div> Ocupada — en servicio
        </div>
        <div class="leyenda-item">
            <div class="dot dot-reservada"></div> Reservada
        </div>
    </div>
</div>

</body>
</html>
